<div class="flex justify-center py-12">
  <div
    class="rounded-card border-border bg-surface grid w-full max-w-[64rem] grid-cols-1 overflow-hidden border md:grid-cols-2"
  >
    <div class="p-8">
      <h1 class="text-h2 font-display font-semibold tracking-tighter">Welcome back</h1>

      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 flex flex-col gap-4">
        @if (formError(); as message) {
          <p class="rounded-control bg-danger-soft text-body-sm text-danger-fixed px-3 py-2">
            {{ message }}
          </p>
        }

        <div class="flex flex-col gap-1">
          <label for="email" class="text-label font-semibold">Email</label>
          <input
            id="email"
            type="email"
            formControlName="email"
            autocomplete="email"
            class="rounded-control border-border bg-surface-3 border px-3 py-2.5 text-base"
          />
        </div>

        <div class="flex flex-col gap-1">
          <label for="password" class="text-label font-semibold">Password</label>
          <div class="relative">
            <input
              id="password"
              [type]="passwordVisible() ? 'text' : 'password'"
              formControlName="password"
              autocomplete="current-password"
              class="rounded-control border-border bg-surface-3 w-full border py-2.5 pr-11 pl-3 text-base"
            />
            <app-password-toggle [visible]="passwordVisible()" (toggled)="togglePassword()" />
          </div>
        </div>

        <button
          type="submit"
          [disabled]="form.invalid || submitting()"
          class="rounded-control bg-accent hover:bg-accent-hover mt-2 h-10 text-sm font-semibold text-white transition-colors disabled:cursor-not-allowed disabled:opacity-50"
        >
          {{ submitting() ? 'Logging in…' : 'Log in' }}
        </button>
      </form>

      <p class="text-body-sm text-muted mt-6 text-center">
        Don't have an account?
        <a routerLink="/signup" class="text-accent hover:text-accent-hover font-semibold"
          >Sign up</a
        >
      </p>
    </div>

    <div class="hidden md:block">
      <app-auth-branding-panel tagline="Welcome back — pick up right where you left off." />
    </div>
  </div>
</div>
