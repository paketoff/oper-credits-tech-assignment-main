<div class="flex flex-col gap-4">
  <p class="text-body-sm text-muted" role="status">
    {{ checklist().satisfied_count }} of {{ checklist().required_count }} required documents
    uploaded.
  </p>

  @for (item of checklist().items; track item.doc_type) {
    <app-upload-field
      [item]="item"
      [status]="statusFor(item.doc_type)"
      [errorMessage]="errorFor(item.doc_type)"
      (fileSelected)="fileSelected.emit({ docType: item.doc_type, file: $event })"
      (documentRemoved)="documentRemoved.emit({ docType: item.doc_type, documentId: $event })"
    />
  }
</div>
