<form [formGroup]="form()" class="flex flex-col gap-4">
  <div class="flex flex-col gap-1">
    <label for="wizard_region" class="text-label font-semibold">Region</label>
    <p-select
      inputId="wizard_region"
      formControlName="region"
      [options]="regionOptions"
      optionLabel="label"
      optionValue="value"
      class="w-full"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="property_type" class="text-label font-semibold">Property type</label>
    <p-select
      inputId="property_type"
      formControlName="property_type"
      [options]="propertyTypeOptions"
      optionLabel="label"
      optionValue="value"
      class="w-full"
    />
  </div>

  <div class="flex flex-col gap-1">
    <label for="wizard_purchase_price" class="text-label font-semibold">Purchase price</label>
    <p-inputnumber
      inputId="wizard_purchase_price"
      formControlName="purchase_price"
      mode="currency"
      currency="EUR"
      locale="nl-BE"
      class="w-full"
    />
  </div>

  <div class="flex items-start gap-2">
    <input
      id="wizard_is_first_home"
      type="checkbox"
      formControlName="is_first_home"
      class="rounded-control border-border mt-1 size-4 border"
    />
    <label for="wizard_is_first_home" class="flex flex-col gap-0.5">
      <span class="text-label font-semibold">This will be my only home</span>
      <span class="text-body-sm text-muted"
        >Reduced purchase tax applies if this will be your only home.</span
      >
    </label>
  </div>
</form>
