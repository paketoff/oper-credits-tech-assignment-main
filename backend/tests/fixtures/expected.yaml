# What each synthetic document should produce (T60).
#
# Data, not schema — which is the one place YAML genuinely belongs here. The
# schemas themselves are pydantic (T56), so the prompt and the type cannot
# drift; this file is the human-readable, hand-correctable answer key.
#
# `fields` holds only what a correct read returns. A field absent here is one
# the document does not state, not one we tolerate being wrong.
#
# Every value is invented. See README.md.

documents:
  - id: payslip-01
    doc_type: PAYSLIPS
    fields: { net_monthly_pay: "3200.00", period: "2026-03" }
    proposes: { net_monthly_income: "3200.00" }
  - id: payslip-02
    doc_type: PAYSLIPS
    fields: { net_monthly_pay: "2450.00", period: "2026-02" }
    proposes: { net_monthly_income: "2450.00" }
  - id: payslip-03
    doc_type: PAYSLIPS
    fields: { net_monthly_pay: "3900.00", period: "2026-01" }
    proposes: { net_monthly_income: "3900.00" }
  - id: payslip-04
    doc_type: PAYSLIPS
    fields: { net_monthly_pay: "2175.00", period: "2026-03" }
    proposes: { net_monthly_income: "2175.00" }

  - id: tax-01
    doc_type: TAX_ASSESSMENT
    fields: { assessment_year: 2025, net_taxable_income: "48000.00" }
    proposes: { net_monthly_income: "4000.00" }
  - id: tax-02
    doc_type: TAX_ASSESSMENT
    fields: { assessment_year: 2025, net_taxable_income: "35400.00" }
    proposes: { net_monthly_income: "2950.00" }
  - id: tax-03
    doc_type: TAX_ASSESSMENT
    fields: { assessment_year: 2024, net_taxable_income: "61200.00" }
